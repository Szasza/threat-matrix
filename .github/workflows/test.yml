name: Tests

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Lint
        run: npm run lint -- --error-on-warnings

      # Biome exits successfully on info-level diagnostics (e.g. an outdated
      # config schema or a deprecated option), so read the count from the
      # JSON summary instead.
      - name: Fail on lint notices
        run: |
          report=$(npx biome check --reporter=json)
          infos=$(jq -e '.summary.infos' <<< "$report")
          if [ "$infos" -ne 0 ]; then
            echo "::error::Biome reported $infos notice(s). Run 'npm run lint' locally to see them."
            exit 1
          fi

      # Dev-only tooling (e.g. semantic-release's bundled npm) is excluded:
      # it never ships, and its advisories often have no upstream fix yet.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # If the cache misses, download Chromium and its OS-level system dependencies
      - name: Install Playwright Chromium + Deps (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # If the cache hits, only install the OS-level system dependencies (fast)
      - name: Install Playwright Deps Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          STORYBOOK_DISABLE_TELEMETRY: ${{ vars.STORYBOOK_DISABLE_TELEMETRY }}

      - name: Report coverage on PR
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload full coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
